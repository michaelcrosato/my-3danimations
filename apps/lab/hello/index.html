<!doctype html>
<!-- The first-flight demo (PLAN.md WP-4.6): a test character idling, walking, running, jumping and attacking. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>m3a hello</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f4f2ec; color: #26231e; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; touch-action: none; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; gap: 12px; flex-wrap: wrap; align-items: baseline; pointer-events: none; }
      #hud b { font-size: 16px; }
      #hit { position: fixed; top: 30%; left: 0; right: 0; text-align: center; font-size: 56px; font-weight: 800; color: #c2410c; opacity: 0; transition: opacity 0.35s; pointer-events: none; }
      #hit.on { opacity: 1; transition: none; }
      #stamp { position: fixed; right: 10px; bottom: max(6px, env(safe-area-inset-bottom)); font-size: 11px; opacity: 0.6; }
      #help { position: fixed; left: 12px; bottom: max(6px, env(safe-area-inset-bottom)); font-size: 12px; opacity: 0.7; }
      .pad { position: fixed; bottom: max(28px, env(safe-area-inset-bottom)); display: none; gap: 10px; }
      .pad button { width: 64px; height: 64px; border-radius: 50%; border: 0; background: #26231ecc; color: #fff; font: 600 13px system-ui; }
      #stick { left: 24px; width: 120px; height: 120px; border-radius: 50%; background: #26231e22; }
      #knob { position: absolute; left: 40px; top: 40px; width: 40px; height: 40px; border-radius: 50%; background: #26231e99; }
      #buttons { right: 20px; }
      @media (pointer: coarse) { .pad { display: flex; } #help { display: none; } }
    </style>
  </head>
  <body>
    <div id="hud"><b id="mode">loading</b><span id="speed"></span><span id="hits"></span><span id="clip"></span></div>
    <div id="hit">HIT</div>
    <div id="stick" class="pad"><div id="knob"></div></div>
    <div id="buttons" class="pad"><button id="b-run">Run</button><button id="b-jump">Jump</button><button id="b-attack">Attack</button></div>
    <div id="help">WASD or arrows to move, Shift to run, Space to jump, J to attack</div>
    <div id="stamp"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>

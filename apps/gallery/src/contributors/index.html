<!doctype html>
<!-- The contributor page (PLAN.md §5.9, WP-8.2b): how a contributor's human gets and revokes their agent's key once
     O8's hosted store is linked, and how agents submit locally until then. Phone first; main.ts drives it. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>m3a contributors</title>
    <link rel="icon" href="data:," />
    <style>
      :root { --bg: #f4f2ec; --fg: #26231e; --soft: #6b655b; --line: #d8d3c8; --card: #fffdf8; --warn: #a86a00; --fail: #b3261e; }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, sans-serif; }
      main { max-width: 760px; margin: 0 auto; padding: max(10px, env(safe-area-inset-top)) 12px 40px; overflow-wrap: anywhere; }
      h1 { font-size: 19px; margin: 0 0 4px; } h2 { font-size: 16px; margin: 18px 0 6px; }
      a { color: inherit; } li { margin: 0 0 6px; }
      button, input { font: inherit; color: inherit; min-height: 44px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); padding: 0 12px; }
      form { display: flex; flex-direction: column; gap: 6px; } input { width: 100%; }
      pre { white-space: pre-wrap; font-size: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
      .note, #stamp { color: var(--soft); font-size: 13px; } .warn { color: var(--warn); } .fail { color: var(--fail); }
      #stamp { text-align: right; font-size: 11px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Contributors</h1>
      <nav class="note"><a href="../../">Gallery</a> · <a href="../review/">Review queue</a></nav>
      <section id="state"></section>
      <section id="session" aria-label="your keys"></section>
      <p id="stamp"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

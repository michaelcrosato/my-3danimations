<!doctype html>
<!-- The gallery (PLAN.md WP-8.1): the owner's ground station. Phone first (390x844, touch), two columns on a desk. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>m3a gallery</title>
    <link rel="icon" href="data:," />
    <style>
      :root { --bg: #f4f2ec; --fg: #26231e; --soft: #6b655b; --line: #d8d3c8; --card: #fffdf8; --pass: #2f7d32; --warn: #a86a00; --fail: #b3261e; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
      #app { display: flex; flex-direction: column; height: 100dvh; padding-bottom: env(safe-area-inset-bottom); }
      #stage { position: relative; flex: 0 0 auto; height: 44dvh; min-height: 240px; overflow: hidden; }
      #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #hud { position: absolute; top: max(6px, env(safe-area-inset-top)); left: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none; }
      #hud > * { pointer-events: auto; }
      #legend { font-size: 12px; color: #444; background: rgba(255, 255, 255, 0.8); border-radius: 6px; padding: 2px 6px; }
      #legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 3px 0 6px; vertical-align: -1px; }
      #legend .left { background: rgb(74, 140, 214); } #legend .back { background: rgb(120, 78, 22); } #legend .nose { background: rgb(160, 52, 40); }
      #title { font-size: 15px; flex: 1 1 100%; overflow-wrap: anywhere; }
      #notice { position: absolute; left: 10px; right: 10px; bottom: 6px; color: var(--fail); font-size: 12px; }
      select, button, input { font: inherit; color: inherit; }
      select, button { min-height: 40px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); padding: 0 10px; }
      #transport { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; padding: 6px 10px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
      #transport button { min-width: 48px; }
      #scrub { flex: 1 1 140px; min-height: 36px; }
      #time { font-variant-numeric: tabular-nums; min-width: 128px; }
      #rate-box { display: flex; gap: 6px; align-items: center; }
      #rate { width: 110px; }
      #tabs { flex: 0 0 auto; display: flex; overflow-x: auto; gap: 4px; padding: 6px 10px 0; }
      #tabs button { flex: 0 0 auto; padding: 0 8px; font-size: 13px; border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
      #tabs button[aria-current="true"] { background: var(--fg); color: var(--bg); }
      #panel { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 8px 10px 40px; -webkit-overflow-scrolling: touch; }
      #panel h3 { margin: 14px 0 6px; font-size: 14px; }
      .list { list-style: none; margin: 0; padding: 0; }
      .list li { margin: 0 0 4px; }
      .list button { width: 100%; text-align: left; padding: 8px 10px; min-height: 44px; }
      .list button[aria-current="true"] { border-color: var(--fg); box-shadow: inset 4px 0 0 var(--fg); }
      .state { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
      .state button { width: auto; }
      .tier { font-size: 11px; padding: 1px 6px; border-radius: 999px; background: var(--line); }
      .tier-cc0 { background: #d7ecd9; } .tier-cc-by { background: #f6e3b8; } .tier-cmu { background: #e3d9f2; } .tier-local { background: #f2d4d0; }
      .reply { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 0 0 8px; }
      .reply.ok .verdict, .pass { color: var(--pass); } .reply.findings .verdict, .warn { color: var(--warn); } .reply.error .verdict, .reply.usage .verdict, .fail { color: var(--fail); }
      .verdict { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
      .reply pre { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; }
      .next, .note { margin: 6px 0 0; color: var(--soft); font-size: 12px; overflow-wrap: anywhere; }
      .picture { display: block; width: 100%; height: auto; image-rendering: pixelated; background: #fff; border: 1px solid var(--line); border-radius: 6px; }
      #search { display: flex; gap: 6px; }
      #search input { flex: 1; min-height: 40px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; background: var(--card); }
      #stamp { position: fixed; right: 8px; bottom: max(4px, env(safe-area-inset-bottom)); font-size: 11px; color: var(--soft); background: #f4f2eccc; padding: 1px 6px; border-radius: 6px; pointer-events: none; z-index: 10; }
      @media (min-width: 900px) {
        #app { display: grid; grid-template-columns: 1fr 440px; grid-template-rows: 1fr auto; grid-template-areas: "stage side" "transport side"; }
        #stage { grid-area: stage; height: auto; }
        #transport { grid-area: transport; border-bottom: 0; }
        #side { grid-area: side; display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); }
      }
      #side { display: contents; }
      @media (min-width: 900px) { #side { display: flex; } }
    </style>
  </head>
  <body>
    <main id="app">
      <section id="stage" aria-label="stage">
        <div id="hud"><b id="title">loading</b><select id="char" aria-label="character"></select><select id="view" aria-label="view"></select><span id="legend" hidden><i class="sw left"></i>its left side <i class="sw back"></i>its back <i class="sw nose"></i>its nose: where it faces</span></div>
        <div id="notice" role="status"></div>
      </section>
      <section id="transport" aria-label="transport">
        <button id="b-back" type="button" aria-label="a frame back">&#9664;|</button>
        <button id="b-play" type="button">Pause</button>
        <button id="b-fwd" type="button" aria-label="a frame forward">|&#9654;</button>
        <input id="scrub" type="range" min="0" max="1" step="0.01" value="0" aria-label="time" />
        <span id="time"></span>
        <label id="rate-box">rate <input id="rate" type="range" min="0.1" max="2" step="0.05" value="1" /><output id="rate-out">1.00x</output></label>
      </section>
      <div id="side">
        <nav id="tabs" aria-label="panels"></nav>
        <section id="panel" aria-label="panel"></section>
      </div>
    </main>
    <div id="stamp"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>

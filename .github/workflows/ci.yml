# CI (PLAN.md §6, WP-0.5): T0 and T1 on every push, T2 on pull requests (and the other three.js candidate's pin test),
# a gate's command set by manual dispatch.
# Actions are pinned by commit SHA (principle 9); the comment names the release.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      gate:
        description: "The gate to run (G0, G1, ...)"
        required: true
        default: G0

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "0"

jobs:
  t0-t1:
    name: T0 check and T1 test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: m3a-cache-${{ runner.os }}-${{ hashFiles('tools/pins.json', 'tools/fixtures/rigs.json', 'package-lock.json') }}
          restore-keys: m3a-cache-${{ runner.os }}-
      - run: npm ci
      # the real CC0 rigs by hash (WP-4.2), so their tests run; cached with .cache
      - run: npm run fixtures -- fetch
      - run: npm run check -- --json
      - run: npm test -- --json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-output-t0-t1
          path: check-output/
          if-no-files-found: ignore

  t2:
    name: T2 e2e
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: m3a-cache-${{ runner.os }}-${{ hashFiles('tools/pins.json', 'tools/fixtures/rigs.json', 'package-lock.json') }}
          restore-keys: m3a-cache-${{ runner.os }}-
      - run: npm ci
      # The cloud container has Chromium preinstalled; CI runners fetch the build the pinned Playwright expects.
      - run: npx playwright install --with-deps chromium
      # the real CC0 rigs, so captures draw them too (WP-4.5)
      - run: npm run fixtures -- fetch
      - run: npm run e2e -- --json
      # a failure's whole browser log in the job's own log (the summary shows only its last lines)
      - if: failure()
        run: tail -n 120 check-output/e2e/playwright.log
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-output-t2
          path: check-output/
          if-no-files-found: ignore

  three-next:
    # the other three.js candidate (WP-4.1, D45, docs/THREE.md): the pin test on r186, served beside the pinned r182;
    # its WebGL 2 result is checked and its WebGPU result reported, so the day a browser or a release fixes it shows here
    name: three r186 (the other candidate)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm install --no-save --no-package-lock --prefix .cache/three-next three@0.186.1
      - run: node_modules/.bin/playwright test three
        env:
          M3A_THREE_DIR: .cache/three-next/node_modules/three

  gate:
    name: Gate (manual dispatch)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: m3a-cache-${{ runner.os }}-${{ hashFiles('tools/pins.json', 'tools/fixtures/rigs.json', 'package-lock.json') }}
          restore-keys: m3a-cache-${{ runner.os }}-
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run pins -- fetch
      - run: npm run fixtures -- fetch
      - run: npm run gate -- "$GATE" --json
        env:
          GATE: ${{ inputs.gate }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-${{ inputs.gate }}
          path: check-output/
          if-no-files-found: ignore

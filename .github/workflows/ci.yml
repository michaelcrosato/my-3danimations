# CI (PLAN.md §6, WP-0.5): T0 and T1 on every push (T1 in two parts side by side, D148), T2 on pull requests (and beside
# it the rate sweep in full, D126, and the other three.js candidate's pin test), a gate's command set by manual dispatch
# (the gates that run no benchmark agent: G4, G6, G7 and G9 run theirs through the claude CLI, in a session), and,
# dispatched with the gate `intake-contract`, the intake store's contract suite against O8's linked project (G9's hosted
# proof): the secret M3A_INTAKE_SUPABASE reaches that one step alone. Each dispatched gate has a concurrency group of
# its own, so dispatching one never cancels another's run.
# Actions are pinned by commit SHA (principle 9); the comment names the release.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      gate:
        description: "The gate to run: G0-G3, G5, G8, G10 or library-pr; intake-contract for the hosted store's contract. G4, G6, G7 and G9 run benchmark agents through the claude CLI, so they run in a session, not here"
        required: true
        default: G0

permissions:
  contents: read

concurrency:
  # inputs.gate is empty on a push or a pull request, so those groups keep their meaning
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ inputs.gate }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "0"

jobs:
  t0-t1:
    # T1 as two jobs side by side (WP-F.15, D148), each half of its files (`npm test -- --shard k/2`) on a runner of
    # its own, free on this public repository; T0 in the first. Neither cancels the other when it fails
    name: ${{ matrix.shard == 1 && 'T0 check and T1 test 1/2' || 'T1 test 2/2' }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: m3a-cache-${{ runner.os }}-${{ hashFiles('tools/pins.json', 'tools/fixtures/rigs.json', 'bench/results/heldout/*/run-*/rig.json', 'package-lock.json') }}
          restore-keys: m3a-cache-${{ runner.os }}-
      - run: npm ci
      # the real CC0 rigs by hash (WP-4.2), so their tests run; cached with .cache
      - run: npm run fixtures -- fetch
      # each gate's held-out rigs (PLAN.md §9.3), so the tests that read them (B1's grader loads every real rig on
      # hand) run too, as in T2; cached with .cache (the key covers their manifests)
      - run: for m in bench/results/heldout/*/run-*/rig.json; do npm run fixtures -- fetch --manifest "$m"; done
      # the pinned sources, so the tests that read them (the carry test) run too (D79); cached with .cache
      - run: npm run pins -- fetch
      - if: matrix.shard == 1
        run: npm run check -- --json
      # a benchmark agent's own /tmp is a mount namespace (D84); as a user, not root, that takes a user namespace,
      # which Ubuntu's AppArmor restricts by default
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: npm test -- --shard ${{ matrix.shard }}/2 --json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-output-t0-t1-${{ matrix.shard }}
          path: check-output/
          if-no-files-found: ignore

  t2:
    name: T2 e2e
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: m3a-cache-${{ runner.os }}-${{ hashFiles('tools/pins.json', 'tools/fixtures/rigs.json', 'bench/results/heldout/*/run-*/rig.json', 'package-lock.json') }}
          restore-keys: m3a-cache-${{ runner.os }}-
      - run: npm ci
      # The cloud container has Chromium preinstalled; CI runners fetch the build the pinned Playwright expects.
      - run: npx playwright install --with-deps chromium
      # the real CC0 rigs, so captures draw them too (WP-4.5)
      - run: npm run fixtures -- fetch
      # each gate's held-out rigs (PLAN.md §9.3), so first-flight's set plays on them too
      - run: for m in bench/results/heldout/*/run-*/rig.json; do npm run fixtures -- fetch --manifest "$m"; done
      # a benchmark agent's own /tmp (D84), as in T1
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: npm run e2e -- --json
      # a failure's whole browser log in the job's own log (the summary shows only its last lines)
      - if: failure()
        run: tail -n 120 check-output/e2e/playwright.log
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-output-t2
          path: check-output/
          if-no-files-found: ignore

  rates:
    # the root-motion rate sweep in full (D123) on a runner of its own, beside T2 (D126): every locomotion loop at every
    # rate on the six bodies against library/baselines/rates.json, its worker threads' rows checked against one
    # thread's, on every pull request T2 runs on. Its threads take every CPU, so inside T2 it took 109.5 s of the 480 s
    # budget (#20); T2 sweeps two of the bodies whole
    name: Rate sweep in full
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
      # restored, never saved: T2's run saves the cache whole (the held-out rigs too)
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: m3a-cache-${{ runner.os }}-${{ hashFiles('tools/pins.json', 'tools/fixtures/rigs.json', 'bench/results/heldout/*/run-*/rig.json', 'package-lock.json') }}
          restore-keys: m3a-cache-${{ runner.os }}-
      - run: npm ci
      # the real CC0 rigs by hash: Quaternius' mannequin and KayKit's knight are two of the six bodies
      - run: npm run fixtures -- fetch
      - run: npm run test:full -- tools/sweep/rates.test.ts

  three-next:
    # the other three.js candidate (WP-4.1, D45, docs/THREE.md): the pin test on r186, served beside the pinned r182;
    # its WebGL 2 result is checked and its WebGPU result reported, so the day a browser or a release fixes it shows here
    name: three r186 (the other candidate)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm install --no-save --no-package-lock --prefix .cache/three-next three@0.186.1
      - run: node_modules/.bin/playwright test three
        env:
          M3A_THREE_DIR: .cache/three-next/node_modules/three

  gate:
    name: Gate (manual dispatch)
    if: github.event_name == 'workflow_dispatch' && inputs.gate != 'intake-contract'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: m3a-cache-${{ runner.os }}-${{ hashFiles('tools/pins.json', 'tools/fixtures/rigs.json', 'bench/results/heldout/*/run-*/rig.json', 'package-lock.json') }}
          restore-keys: m3a-cache-${{ runner.os }}-
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run pins -- fetch
      - run: npm run fixtures -- fetch
      # each gate's held-out rigs (PLAN.md §9.3), as T1 and T2 fetch them: T2's demo plays on them and G4's freshness
      # check reads them, so a cold or partial .cache doesn't fail the gate
      - run: for m in bench/results/heldout/*/run-*/rig.json; do npm run fixtures -- fetch --manifest "$m"; done
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: npm run gate -- "$GATE" --json
        env:
          GATE: ${{ inputs.gate }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-${{ inputs.gate }}
          path: check-output/
          if-no-files-found: ignore

  intake-contract:
    name: The intake's contract on O8's project (manual dispatch)
    if: github.event_name == 'workflow_dispatch' && inputs.gate == 'intake-contract'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --ignore-scripts
      # the project's JSON ({ url, apikey, service, owner, a, b, impostor }, packages/tools/test/intake-contract.test.ts):
      # unset, the run fails rather than skip, since a dispatch asks for the hosted proof
      - run: |
          [ -n "$M3A_INTAKE_SUPABASE" ] || { echo "::error::the secret M3A_INTAKE_SUPABASE is unset: link O8's project first (PLAN.md §5.9)"; exit 1; }
          npx vitest run packages/tools/test/intake-contract.test.ts
        env:
          M3A_INTAKE_SUPABASE: ${{ secrets.M3A_INTAKE_SUPABASE }}
